[package]
name = "web_leptos"
version = "0.1.0"
edition = "2021"
description = "Techub Comms — Leptos WASM web frontend with metallic turquoise theme"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlInputElement", "HtmlTextAreaElement", "Node",
    "Request", "RequestInit", "RequestMode", "Response",
    "Headers", "Url", "Storage", "Location", "console",
    "MediaStream", "MediaStreamConstraints", "Navigator",
    "Notification", "NotificationPermission",
    "Performance", "PerformanceTiming",
    "HtmlDocument",
] }
js-sys = "0.3"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
