services:
  - type: web
    name: techub-comms-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: RUST_LOG
        value: info
      - key: PORT
        value: 3039
      - key: BASE_URL
        value: https://techub-comms-app.onrender.com
      - key: FRONTEND_URL
        value: https://techub-comms-app.onrender.com
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      - key: VONAGE_APPLICATION_ID
        sync: false
      - key: VONAGE_PRIVATE_KEY_B64
        sync: false
      - key: VONAGE_NUMBER
        sync: false
      - key: VONAGE_MONITORING_TOKEN
        sync: false
      - key: VONAGE_RECORDING_TOKEN
        sync: false
      - key: VONAGE_BROADCAST_TOKEN
        sync: false
      - key: VONAGE_COMPOSER_TOKEN
        sync: false
      - key: VONAGE_CAPTIONS_TOKEN
        sync: false
      - key: VONAGE_SIP_MONITORING_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeploy: true
