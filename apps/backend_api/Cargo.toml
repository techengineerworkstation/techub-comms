[package]
name = "backend_api"
version = "0.1.0"
edition = "2021"
description = "Techub Comms Rust backend — Actix-web server with Vonage API integration and static file serving"

[dependencies]
shared_core = { path = "../../packages/shared_core" }
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"
actix-files = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
env_logger = "0.11"
dotenvy = "0.15"
jsonwebtoken = "9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
regex = "1"
lazy_static = "1"
sha2 = "0.10"
hex = "0.4"
num_cpus = "1"
futures = "0.3"
actix-http = "3"
mime_guess = "2"
